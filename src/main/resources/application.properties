spring.application.name=roamwise
spring.jpa.hibernate.ddl-auto=update

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/roamwise}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:root}
jwt.secret=${JWT_SECRET}
roamwise.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200, http://localhost:4000}
google.places.api.key=${GOOGLE_PLACES_KEY}
openai.api.key=${OPENAI_API_KEY}
openweather.api.key=${OPENWEATHERAPI_KEY}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.frontend-url=${FRONTEND_URL:http://localhost:4200}
spring.data.redis.ssl.enabled=true