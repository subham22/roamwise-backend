<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width"></head>
<body style="margin:0;padding:0;background:#fff8f0;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#fff8f0;">
    <tr><td align="center" style="padding:32px 16px;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
               style="max-width:560px;background:#ffffff;border-radius:16px;
                    font-family:Arial,Helvetica,sans-serif;color:#14213d;">
            <tr><td style="padding:28px 32px 8px;">
                <img src="https://roamwise.live/logo.png" width="36" height="36" alt="Roamwise"
                     style="vertical-align:middle;border-radius:10px;">
                <span style="font-size:20px;font-weight:800;vertical-align:middle;margin-left:8px;">Roamwise</span>
            </td></tr>
            <tr><td style="padding:16px 32px;">
                <h1 style="margin:0 0 12px;font-size:24px;line-height:1.3;">Reset your password</h1>
                <p style="margin:0 0 24px;font-size:16px;line-height:1.6;color:#4a4f5a;">
                    We got a request to reset your Roamwise password. This link expires in 1 hour.
                </p>
                <a th:href="${resetLink}"
                   style="display:inline-block;background:#c23a2b;color:#ffffff;text-decoration:none;
                    font-weight:700;font-size:16px;padding:14px 24px;border-radius:12px;">
                    Reset password
                </a>
                <p style="margin:24px 0 0;font-size:13px;line-height:1.6;color:#676c78;">
                    Button not working? Paste this link into your browser:<br>
                    <a th:href="${resetLink}" th:text="${resetLink}" style="color:#c23a2b;word-break:break-all;"></a>
                </p>
            </td></tr>
            <tr><td style="padding:24px 32px 28px;font-size:12px;color:#676c78;border-top:1px solid #f0e6da;">
                If you didn't request this, you can ignore this email. Your password won't change.<br>
                Roamwise · <a href="https://roamwise.live" style="color:#676c78;">roamwise.live</a>
            </td></tr>
        </table>
    </td></tr>
</table>
</body>
</html>
