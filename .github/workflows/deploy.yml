name: Deploy backend
on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Build here, not on the server: the free Oracle micro VM has only 1 GB RAM
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # shortcut: amd64 only (Oracle micro VMs); add linux/arm64 if moving to an A1 VM
          platforms: linux/amd64
          tags: ghcr.io/subham22/roamwise-backend:latest

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: GHCR_USER,GHCR_TOKEN
          script: |
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            cd roamwise-infra && git checkout -q main && git pull -q
            docker compose pull backend
            docker compose up -d
            # fail the run if the new backend never answers (e.g. it crashed while updating the schema)
            for i in $(seq 1 36); do
              curl -sf -o /dev/null "http://$(hostname -I | cut -d' ' -f1):8080/api/guides" && echo "backend healthy" && break
              [ "$i" = 36 ] && { echo "backend did not come up"; docker compose logs --tail 80 backend; exit 1; }
              sleep 5
            done
            docker image prune -f
            # nightly DB backup at 03:00 IST (21:30 UTC); install once, then take one now
            mkdir -p ~/backups
            crontab -l 2>/dev/null | grep -q roamwise-infra/backup.sh || \
              (crontab -l 2>/dev/null; echo '30 21 * * * $HOME/roamwise-infra/backup.sh >> $HOME/backups/backup.log 2>&1') | crontab -
            ./backup.sh >> ~/backups/backup.log 2>&1 && tail -1 ~/backups/backup.log
